# Server port. Chosen to avoid colliding with the fanvote stack's 8070/8080/8090/4200
# when both are run on the same machine.
server.port=${SERVER_PORT:8081}

spring.application.name=clinic-backend

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/clinic}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:clinic}

# Keycloak. Same shared infra as fanvote, different realm/client — see README.
# Point this at the fanvote local Keycloak (http://localhost:8080) with a "clinic"
# realm imported, or leave it unset: pages that don't need auth still work, only
# the JWT validation filter fails to start talking to an issuer that doesn't exist
# until a real one is configured.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/clinic}

# CORS — the Angular dev server's origin.
clinic.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sensible default weekly schedule seeded on first startup when the collection is
# empty: Mon-Fri 09:00-17:00, 30 minute slots, weekend closed. See
# ScheduleSeedInitializer. Not gated behind a flag like fanvote's demo-data seed —
# it is idempotent and never destructive, it only fills in what is missing.
